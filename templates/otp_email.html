<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: 'Segoe UI', sans-serif; background: #0B0B0F; color: #EEF2F5; padding: 40px; }
        .card { max-width: 500px; margin: 0 auto; background: #15161C; border: 1px solid rgba(102, 252, 241, 0.2); border-radius: 16px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #66FCF1 0%, #45A29E 100%); padding: 30px; text-align: center; color: #000; }
        .body { padding: 40px; text-align: center; }
        .otp-code { font-size: 40px; font-weight: 700; color: #66FCF1; letter-spacing: 10px; margin: 30px 0; }
        .footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 12px; color: #8B949E; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1 style="margin: 0; font-size: 24px;">Verify Your Account</h1>
            </div>
            <div class="body">
                <p>Welcome to Smriti.ai! Use the secure OTP below to complete your registration.</p>
                <div class="otp-code">{{ otp }}</div>
                <p style="font-size: 14px; color: #8B949E;">This code will expire in 10 minutes.</p>
            </div>
            <div class="footer">
                &copy; 2026 Smriti.ai Agentic Platforms. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>
