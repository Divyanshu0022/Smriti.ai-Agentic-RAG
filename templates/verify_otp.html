<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Smriti.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/premium.css">
    <style>
        :root { --bg: #0b0f19; --surface: rgba(19, 24, 38, 0.7); --accent: #66FCF1; --border: rgba(102, 252, 241, 0.2); }
        body { font-family: 'Inter', sans-serif; background: #080b12; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .auth-card { background: var(--surface); backdrop-filter: blur(15px); border: 1px solid var(--border); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        .otp-input { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 24px; text-align: center; letter-spacing: 5px; margin: 20px 0; font-family: 'Space Grotesk'; }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .error { color: #ff6b6b; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <i class="fa-solid fa-envelope-circle-check" style="font-size: 40px; color: var(--accent); margin-bottom: 20px;"></i>
        <h1 style="font-family: 'Space Grotesk'; margin: 0;">Verify OTP</h1>
        <p style="color: #9ca3af; font-size: 14px; margin-top: 10px;">Check your email for the 6-digit verification code.</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/verify_otp">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <input type="text" name="otp" class="otp-input" placeholder="000000" maxlength="6" required>
            <button type="submit" class="btn">Verify Account</button>
        </form>
    </div>
</body>
</html>
