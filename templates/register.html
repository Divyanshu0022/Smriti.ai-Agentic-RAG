<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smriti.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/premium.css">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: rgba(19, 24, 38, 0.7);
            --border: rgba(102, 252, 241, 0.2);
            --accent: #66FCF1;
            --text-main: #f3f4f6;
        }
        body { font-family: 'Inter', sans-serif; background: #080b12; color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; position: relative; overflow-x: hidden; }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #tsparticles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .auth-card { background: rgba(19, 24, 38, 0.7); backdrop-filter: blur(15px); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; position: relative; z-index: 10; margin: 20px; }
        .auth-card i { font-size: 40px; color: var(--accent); margin-bottom: 20px; }
        .auth-card h1 { font-family: 'Space Grotesk', sans-serif; margin: 0 0 10px 0; font-size: 24px; color: white; }
        .auth-card p { color: var(--text-mut); font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-mut); }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; font-family: 'Inter'; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error { color: #ff6b6b; font-size: 13px; margin-bottom: 20px; background: rgba(255,107,107,0.1); padding: 10px; border-radius: 6px; }
        .links { margin-top: 20px; font-size: 13px; }
        .links a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <!-- Premium Background -->
    <div class="mesh-bg">
        <div class="mesh-orb orb1"></div>
        <div class="mesh-orb orb2"></div>
        <div class="mesh-orb orb3"></div>
    </div>
    <div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>

    <div class="auth-card">
        <i class="fa-solid fa-user-plus"></i>
        <h1>Create Account</h1>
        <p>Register to unlock premium features and agent API access.</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/register">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="e.g. mithila_user" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
            <button type="submit" class="btn">Send Verification OTP</button>
        </form>

        <div style="margin: 24px 0; display: flex; align-items: center; gap: 10px;">
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
            <span style="font-size: 12px; color: var(--text-mut);">OR CONTINUE WITH</span>
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
        </div>

        <button type="button" class="btn" style="background: white; color: #15161C; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: not-allowed; opacity: 0.6;" title="Future Update">
            <i class="fa-brands fa-google" style="color: #4285F4; margin: 0; font-size: 18px;"></i>
            Sign in with Google
        </button>
        
        <div class="links">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load("tsparticles", {
            fpsLimit: 60,
            particles: {
                number: { value: 30, density: { enable: true, area: 800 } },
                color: { value: ["#66FCF1", "#45A29E"] },
                shape: { type: "circle" },
                opacity: { value: 0.2 },
                size: { value: { min: 1, max: 2 } },
                move: { enable: true, speed: 0.5, direction: "none", random: true, outModes: "out" },
                links: { enable: true, color: "#66FCF1", distance: 150, opacity: 0.1, width: 1 }
            }
        });
    </script>
</body>
</html>
