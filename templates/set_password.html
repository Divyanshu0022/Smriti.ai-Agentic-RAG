<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | Smriti.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0f19; --surface: rgba(19, 24, 38, 0.7); --accent: #66FCF1; --border: rgba(102, 252, 241, 0.2); }
        body { font-family: 'Inter', sans-serif; background: #080b12; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .auth-card { background: var(--surface); backdrop-filter: blur(15px); border: 1px solid var(--border); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: scale(1.01); }
    </style>
</head>
<body>
    <div class="auth-card">
        <i class="fa-solid fa-lock" style="font-size: 40px; color: var(--accent); margin-bottom: 20px;"></i>
        <h1 style="font-family: 'Space Grotesk'; margin: 0;">Setup Password</h1>
        <p style="color: #9ca3af; font-size: 14px; margin: 15px 0 30px 0;">Verification successful! Now, please set a secure password for your account.</p>
        
        <form method="POST" action="/set_password">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>
            <button type="submit" class="btn">Complete Setup</button>
        </form>
    </div>
</body>
</html>
